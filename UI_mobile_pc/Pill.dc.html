<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span aria-hidden="true" style="{{ s }}"></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:80,&quot;height&quot;:60},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#FF5E4D&quot;,&quot;#FFC020&quot;,&quot;#12C2B0&quot;,&quot;#8D5BF5&quot;,&quot;#93D232&quot;,&quot;#2E78F5&quot;],&quot;default&quot;:&quot;#FF5E4D&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tonda&quot;,&quot;ovale&quot;,&quot;oblunga&quot;,&quot;capsula&quot;],&quot;default&quot;:&quot;tonda&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:28,&quot;min&quot;:10,&quot;max&quot;:120,&quot;tsType&quot;:&quot;number&quot;},&quot;rotate&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  static look(c, shape, w, h) {
    const L = ['radial-gradient(ellipse 60% 50% at 32% 26%, rgba(255,255,255,.85), rgba(255,255,255,0) 62%)',
      'linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(0,0,0,0) 45%, rgba(0,0,0,.26) 100%)'];
    if (shape === 'tonda') L.push('linear-gradient(90deg, rgba(0,0,0,0) 48.5%, rgba(0,0,0,.16) 48.5%, rgba(0,0,0,.16) 51.5%, rgba(0,0,0,0) 51.5%)');
    if (shape === 'capsula') { L.push('linear-gradient(90deg, rgba(0,0,0,0) 49%, rgba(0,0,0,.18) 49%, rgba(0,0,0,.18) 51%, rgba(0,0,0,0) 51%)'); L.push(`linear-gradient(90deg, ${c} 50%, #F5F4EF 50%)`); }
    else L.push(c);
    const round = shape === 'tonda' || shape === 'ovale';
    return { display: 'inline-block', flex: 'none', width: w, height: h, borderRadius: round ? '50%' : h / 2, background: L.join(','),
      boxShadow: `inset 0 -${(h * .08).toFixed(1)}px ${(h * .16).toFixed(1)}px rgba(0,0,0,.16), 0 1px 1.5px rgba(14,22,32,.3)` };
  }
  renderVals() {
    const c = this.props.color ?? '#FF5E4D', shape = this.props.shape ?? 'tonda', L = Number(this.props.size ?? 28);
    const g = { tonda: [.8, .8], ovale: [1, .64], oblunga: [1, .42], capsula: [1, .42] }[shape] || [.8, .8];
    const s = Component.look(c, shape, Math.round(L * g[0]), Math.round(L * g[1]));
    if (this.props.rotate) s.transform = `rotate(${this.props.rotate}deg)`;
    return { s };
  }
}
</script>
</body>
</html>
