<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E7EBEF;-webkit-print-color-adjust:exact;print-color-adjust:exact}
*{box-sizing:border-box}
@media print{body{background:#fff}}
</style>
</helmet>
<div data-screen-label="Stampa A4" style="width:794px;height:1123px;margin:0 auto;background:#FFFFFF;color:#0E1620;font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:56px 52px 44px;display:flex;flex-direction:column;gap:22px">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:3px solid #0E1620;padding-bottom:16px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font:600 20px/1.2 'Geist',sans-serif;color:#44505C">Le medicine di</span>
      <h1 style="margin:0;font:700 44px/1 'Geist',sans-serif;letter-spacing:-.02em">Nonna Anna</h1>
    </div>
    <div style="text-align:right;font:600 22px/1.3 'Geist',sans-serif">Settimana<br>9 – 15 novembre 2026</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 24px">
    <sc-for list="{{ legend }}" as="l" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="flex:none;width:22px;height:22px;border-radius:50%;background:{{ l.dot }};box-shadow:inset 0 -2px 3px rgba(0,0,0,.2),0 0 0 1.5px rgba(0,0,0,.25)"></span>
        <span style="font:600 19px/1.25 'Geist',sans-serif">{{ l.name }} <span style="font-weight:400;color:#44505C">{{ l.dose }} · {{ l.look }}</span></span>
      </div>
    </sc-for>
  </div>
  <div style="display:grid;grid-template-columns:150px repeat(3,1fr);border:2px solid #0E1620;border-radius:10px;overflow:hidden">
    <div style="padding:12px 14px;background:#0E1620;color:#fff;font:600 18px/1.2 'Geist',sans-serif">Giorno</div>
    <div style="padding:12px 14px;background:#0E1620;color:#fff;font:600 18px/1.2 'Geist',sans-serif;border-left:1px solid #44505C">Mattina</div>
    <div style="padding:12px 14px;background:#0E1620;color:#fff;font:600 18px/1.2 'Geist',sans-serif;border-left:1px solid #44505C">Pranzo</div>
    <div style="padding:12px 14px;background:#0E1620;color:#fff;font:600 18px/1.2 'Geist',sans-serif;border-left:1px solid #44505C">Sera</div>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
      <div style="padding:14px;border-top:1.5px solid #AEB8C2;display:flex;flex-direction:column;justify-content:center;gap:2px"><span style="font:700 21px/1.1 'Geist',sans-serif">{{ r.dow }}</span><span style="font:500 17px/1.2 'Geist',sans-serif;color:#44505C">{{ r.date }}</span></div>
      <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="3">
        <div style="padding:12px 14px;border-top:1.5px solid #AEB8C2;border-left:1.5px solid #AEB8C2;display:flex;flex-direction:column;justify-content:center;gap:10px">
          <sc-for list="{{ c }}" as="it" hint-placeholder-count="1">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="flex:none;width:24px;height:24px;border:2.5px solid #0E1620;border-radius:5px"></span>
              <span style="flex:none;width:18px;height:18px;border-radius:50%;background:{{ it.dot }};box-shadow:inset 0 -2px 3px rgba(0,0,0,.2),0 0 0 1.5px rgba(0,0,0,.25)"></span>
              <span style="font:600 19px/1.15 'Geist',sans-serif">{{ it.name }} <span style="font-weight:500;color:#44505C">{{ it.q }}</span></span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </sc-for>
  </div>
  <p style="margin:auto 0 0;font:500 18px/1.4 'Geist',sans-serif;color:#44505C">Fai una crocetta nella casella quando hai preso la medicina.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:794,&quot;height&quot;:1123}}">
class Component extends DCLogic {
  renderVals() {
    const M = [
      { name: 'Ramipril', dose: '5 mg', look: 'gialla, allungata', dot: '#FFC020', slot: 'm', days: [0,1,2,3,4,5,6] },
      { name: 'Cardioaspirina', dose: '100 mg', look: 'rossa, tonda', dot: '#FF5E4D', slot: 'p', days: [0,1,2,3,4,5,6] },
      { name: 'Vitamina D', dose: '25.000 UI', look: 'viola e bianca', dot: '#8D5BF5', slot: 'p', days: [6] },
      { name: 'Atorvastatina', dose: '20 mg', look: 'blu, ovale', dot: '#2E78F5', slot: 's', days: [0,1,2,3,4,5,6] }
    ];
    const DOW = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
    const rows = DOW.map((dow, i) => ({ dow, date: `${9 + i} novembre`,
      cells: ['m', 'p', 's'].map(k => M.filter(m => m.slot === k && m.days.includes(i)).map(m => ({ name: m.name, q: '× 1', dot: m.dot }))) }));
    return { legend: M, rows };
  }
}
</script>
</body>
</html>
